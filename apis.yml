name: Common Paper
description: >-
  Common Paper is a contract management platform that helps revenue, legal, and
  operations teams build, negotiate, sign, and manage commercial agreements in
  minutes using a library of committee-drafted standard agreements (Cloud Service
  Agreement, Mutual NDA, DPA, BAA, Professional Services, Partnership, Software
  License, Pilot, Design Partner, and Letter of Intent) paired with AI-assisted
  contract review. The company exposes a public REST API at api.commonpaper.com/v1
  with Bearer-token authentication, JSON:API read responses, Ransack filtering,
  offset pagination, a documented webhook catalog, an agentic account-provisioning
  flow, and an official hosted MCP server plus a published Claude agent skill, so
  agents and integrations can list, create, send, void, reassign, and download
  agreements and templates programmatically.
